name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Prepare Build Environment
        run: |
          # 1. Create .env if not present
          if [ ! -f ".env" ]; then
            touch .env
          fi

          # 2. Generate debug.keystore if not present
          if [ ! -f "debug.keystore" ]; then
            echo "Generating debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK for Easy Identification
        run: |
          mkdir -p build_output
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} build_output/AlarmClock-debug.apk \;

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlarmClock-APK
          path: build_output/AlarmClock-debug.apk
          retention-days: 30

      - name: Upload APK to Release (if release event)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build_output/AlarmClock-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
